name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect Phase A
        id: phase
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json not present yet — Phase A scaffolding pending; skipping build/check/test."
          fi

      - name: Install Bun
        if: steps.phase.outputs.ready == 'true'

      - name: Build
        if: steps.phase.outputs.ready == 'true'
        run: bun run build

      - name: Lint and format check
        if: steps.phase.outputs.ready == 'true'
        run: bun run ci

      - name: Unit tests with coverage
        if: steps.phase.outputs.ready == 'true'
        run: |
          set -o pipefail
          bun run test:coverage 2>&1 | tee /tmp/bun-coverage.txt

      - name: Coverage summary
        if: always() && steps.phase.outputs.ready == 'true'
        run: |
          [[ -f /tmp/bun-coverage.txt ]] || exit 0
          {
            echo "## Coverage"
            echo ""
            echo '```'
            awk '/^[[:space:]]*---/{p=1} p' /tmp/bun-coverage.txt | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
