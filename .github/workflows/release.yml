name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Bun
        uses: Rethunk-Tech/gh-actions/setup-bun@e04e0afa3e00c59e33030fdbc7df29c15000357b # v1.7
        with:
          bun-version: "1.3.13"

      - name: Assert tag matches package.json version
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Build
        run: bun run build

      - name: Lint and format check
        run: bun run ci

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Create tarball for GitHub Release
        id: pack
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent)
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages (npm registry)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
          p.name = "@rethunk-ai/citadel-sdd";
          p.publishConfig = {
            registry: "https://npm.pkg.github.com",
            access: "public",
          };
          fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          NODE
          {
            echo "@rethunk-ai:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } > .npmrc
          npm publish --access public

      - name: Create GitHub Release (official gh CLI, no third-party action)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" "${{ steps.pack.outputs.tarball }}" \
            --verify-tag \
            --generate-notes
